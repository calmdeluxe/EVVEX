name: Build CalmReader

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy built APK to distribution assets
        run: |
          mkdir -p dist public
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" dist/calmreader.apk
          cp "$APK_FILE" dist/calmreader-latest.apk
          cp "$APK_FILE" public/calmreader.apk
          cp "$APK_FILE" public/calmreader-latest.apk
          echo "APK copied to dist and public successfully. Size: $(ls -lh dist/calmreader.apk | awk '{print $5}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calmreader-apk
          path: |
            dist/calmreader.apk
            dist/calmreader-latest.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: CalmReader Android v1.0.1
          draft: false
          prerelease: false
          files: |
            dist/calmreader.apk
            dist/calmreader-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
