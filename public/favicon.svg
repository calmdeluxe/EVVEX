<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Terracotta & Clay Gradient -->
    <radialGradient id="terracottaGrad" cx="50%" cy="38%" r="65%" fx="45%" fy="30%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="45%" stop-color="#9A3412" />
      <stop offset="85%" stop-color="#6B21A8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Platinum Shimmer Gradient -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Deep Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle with Shadow -->
  <circle cx="256" cy="256" r="236" fill="url(#terracottaGrad)" filter="url(#badgeShadow)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Inner Dotted Artisan Ring (Corkboard / Stitched Craft feel) -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-dasharray="6,8" opacity="0.65" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="#FEF3C7" stroke-width="1.2" opacity="0.35" />

  <!-- Four Compass Beacon Stars -->
  <g fill="#FEF08A" opacity="0.9">
    <!-- Top -->
    <path d="M 256 64 L 260 76 L 272 80 L 260 84 L 256 96 L 252 84 L 240 80 L 252 76 Z" />
    <!-- Bottom -->
    <path d="M 256 416 L 260 428 L 272 432 L 260 436 L 256 448 L 252 436 L 240 432 L 252 428 Z" />
    <!-- Left -->
    <path d="M 80 256 L 84 260 L 96 256 L 84 252 L 80 240 L 76 252 L 64 256 L 76 260 Z" />
    <!-- Right -->
    <path d="M 432 256 L 436 260 L 448 256 L 436 252 L 432 240 L 428 252 L 416 256 L 428 260 Z" />
  </g>

  <!-- Central Interlocking Dual "V" Monarch Wings (EVVEX Identity) -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Wing V (Left & Right Flanks) -->
    <path d="M 124 168 L 184 168 L 256 348 L 328 168 L 388 168 L 284 394 C 274 416, 238 416, 228 394 Z" 
          fill="url(#goldGrad)" />

    <!-- Inner Core V (Brilliant Shimmer Front Layer) -->
    <path d="M 178 184 L 226 184 L 256 266 L 286 184 L 334 184 L 272 328 C 266 342, 246 342, 240 328 Z" 
          fill="url(#shimmerGrad)" />

    <!-- Radiant Spotlight Gathering Star (Center Crown) -->
    <g transform="translate(256, 152)">
      <!-- Pulsing Halo Rays -->
      <circle cx="0" cy="0" r="22" fill="#FEF08A" opacity="0.25" filter="url(#goldGlow)" />
      <!-- 8-Point Sparkling Diamond Star -->
      <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="#FFFFFF" filter="url(#goldGlow)" />
      <path d="M 0 -18 Q 0 0 18 0 Q 0 0 0 18 Q 0 0 -18 0 Q 0 0 0 -18 Z" fill="#FEF08A" />
      <!-- Star Core -->
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Ticket Notch / Admission Arc Base -->
  <path d="M 200 412 C 220 422, 292 422, 312 412" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
</svg>
