    <script>
      // Register Service Worker for PWA Offline Caching and Installation support
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        var isDevEnv = window.location.hostname === 'localhost' || 
                       window.location.hostname.includes('run.app') || 
                       window.location.port === '3000' || 
                       window.location.port === '5173';
        if (isDevEnv) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        } else {
          function registerSW() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function(reg) {
                  reg.update();
                console.log('[Service Worker] Registered successfully on scope:', reg.scope);
              })
              .catch(function(err) {
                console.warn('[Service Worker] Registration handled gracefully:', err.message || err);
              });
          }
          if (document.readyState === 'complete' || document.readyState === 'interactive') {
            registerSW();
          } else {
            window.addEventListener('load', registerSW);
          }
        }
      }

      // Global stashing of the beforeinstallprompt event for custom install triggers
      let deferredPrompt = null;
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later.
        deferredPrompt = e;
        window.deferredPrompt = e;
        console.log('[PWA] beforeinstallprompt event fired and stashed.');
        // Notify any active React listeners
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: { deferredPrompt: e } }));
        window.dispatchEvent(new CustomEvent('pwa-installable-change', { detail: { installable: true } }));
      });

      window.addEventListener('appinstalled', (e) => {
        deferredPrompt = null;
        window.deferredPrompt = null;
        console.log('[PWA] appinstalled event fired. App is successfully installed.');
        // Notify active React listeners
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: { deferredPrompt: null } }));
        window.dispatchEvent(new CustomEvent('pwa-installable-change', { detail: { installable: false } }));
      });
    </script>
    <script>
      console.log("[Index] Bootstrap script running");
      // Resilient memory-fallback storage polyfill for sandboxed/cross-origin iframe views
      (function() {
        var storageTypes = ['localStorage', 'sessionStorage'];
        for (var i = 0; i < storageTypes.length; i++) {
          var type = storageTypes[i];
          var storageAvailable = false;
          try {
            var storage = window[type];
            var testKey = '__storage_test__';
            storage.setItem(testKey, testKey);
            storage.removeItem(testKey);
            storageAvailable = true;
          } catch (e) {
            console.warn("[Storage] Native " + type + " is blocked or throws error: ", e);
          }

          if (!storageAvailable) {
            console.warn("[Storage] Creating resilient in-memory fallback getter for " + type);
            var mockStorage = (function() {
              var store = {};
              return {
                getItem: function(key) {
                  return key in store ? store[key] : null;
                },
                setItem: function(key, value) {
                  store[key] = String(value);
                },
                removeItem: function(key) {
                  delete store[key];
                },
                clear: function() {
                  store = {};
                },
                get length() {
                  return Object.keys(store).length;
                },
                key: function(index) {
                  var keys = Object.keys(store);
                  return keys[index] || null;
                }
              };
            })();
            
            // Try overriding on Window prototype first (most reliable for read-only window properties)
            try {
              Object.defineProperty(Window.prototype, type, {
                get: function() { return mockStorage; },
                configurable: true
              });
              console.log("[Storage] Polyfilled " + type + " on Window.prototype successfully.");
            } catch (errProto) {
              console.warn("[Storage] Failed prototype override for " + type + ", trying fallback defineProperty on window:", errProto);
              try {
                Object.defineProperty(window, type, {
                  value: mockStorage,
                  configurable: true,
                  writable: true
                });
                console.log("[Storage] Polyfilled " + type + " on window object successfully.");
              } catch (errWin) {
                try {
                  window[type] = mockStorage;
                  console.log("[Storage] Polyfilled " + type + " via direct window assignment successfully.");
                } catch (errWinDirect) {
                  console.error("[Storage] Critical: could not override " + type, errWinDirect);
                }
              }
            }
          }
        }
      })();
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("[Index] Runtime Error:", message, source, lineno);
        
        // Ignore benign, non-fatal, development-specific or websocket error messages
        var msgStr = String(message || '').toLowerCase();
        var srcStr = String(source || '').toLowerCase();
        if (
          msgStr.indexOf('resizeobserver') !== -1 ||
          msgStr.indexOf('websocket') !== -1 ||
          msgStr.indexOf('script error') !== -1 ||
          msgStr.indexOf('extension') !== -1 ||
          msgStr.indexOf('vite') !== -1 ||
          srcStr.indexOf('extension') !== -1
        ) {
          return false;
        }

        var reportError = function() {
          var div = document.getElementById('error-banner');
          if (!div) {
            div = document.createElement('div');
            div.id = 'error-banner';
            div.style.position = 'fixed';
            div.style.top = '20px';
            div.style.right = '20px';
            div.style.maxWidth = '400px';
            div.style.backgroundColor = '#fff5f5';
            div.style.color = '#c53030';
            div.style.border = '1px solid #feb2b2';
            div.style.padding = '16px';
            div.style.zIndex = '99999999';
            div.style.borderRadius = '12px';
            div.style.boxShadow = '0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05)';
            div.style.fontFamily = 'system-ui, sans-serif';
            div.style.fontSize = '12px';
            div.style.lineHeight = '1.5';
            document.body.appendChild(div);
          }
          div.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">' +
                            '<div>' +
                              '<strong style="font-weight:700; color:#9b2c2c; display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.05em; font-size:10px;">Diagnostic Warning</strong>' +
                              '<span style="display:block; max-height:80px; overflow-y:auto; word-break:break-word;">' + message + '</span>' +
                              '<span style="color:#a0aec0; font-size:10px; display:block; margin-top:6px;">' + source + ' (' + lineno + ':' + colno + ')</span>' +
                              '<div style="margin-top:10px; display:flex; gap:8px;">' +
                                '<button onclick="window.location.reload()" style="background:#e53e3e; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:700; font-size:10px; cursor:pointer;">RELOAD</button>' +
                                '<button onclick="document.getElementById(\'error-banner\').style.display=\'none\'" style="background:#edf2f7; color:#4a5568; border:none; padding:6px 12px; border-radius:6px; font-weight:700; font-size:10px; cursor:pointer;">DISMISS</button>' +
                              '</div>' +
                            '</div>' +
                            '<button onclick="document.getElementById(\'error-banner\').style.display=\'none\'" style="background:none; border:none; color:#a0aec0; cursor:pointer; font-size:16px; font-weight:bold; padding:0; line-height:1;">&times;</button>' +
                          '</div>';
          div.style.display = 'block';
          
          var warning = document.getElementById('no-js-warning');
          if (warning) warning.style.display = 'block';
        };
        
        if (document.body) {
          reportError();
        } else {
          window.addEventListener('DOMContentLoaded', reportError);
        }
        return false;
      };
      
      window.onunhandledrejection = function(event) {
        console.warn("[Index] Unhandled Rejection (non-fatal):", event.reason);
      };

    <!-- Real-time Console Logs Memory Collector -->
    <script>
      (function(){
        window.__APP_LOGS__ = window.__APP_LOGS__ || [];
        var log = console.log;
        var warn = console.warn;
        var error = console.error;

        function addLog(msg, type) {
          try {
            var timestamp = new Date().toLocaleTimeString();
            window.__APP_LOGS__.push({
              type: type,
              message: msg,
              time: timestamp
            });
            if (window.__APP_LOGS__.length > 500) {
              window.__APP_LOGS__.shift();
            }
            // Broadcast event so Admin Panel can update React state in real-time
            var event = new CustomEvent('newapplog', { detail: { type: type, message: msg, time: timestamp } });
            window.dispatchEvent(event);
          } catch(e) {}
        }

        function safeJoin(args) {
          try {
            return Array.from(args).map(function(arg) {
              try {
                if (typeof arg === 'object' && arg !== null) {
                  return JSON.stringify(arg);
                }
                return String(arg);
              } catch(e) {
                return String(arg);
              }
            }).join(' ');
          } catch(e) {
            return "[Serialization Error]";
          }
        }

        console.log = function() { 
          try { addLog(safeJoin(arguments), 'log'); } catch(e) {}
          log.apply(console, arguments); 
        };
        console.warn = function() { 
          try { addLog(safeJoin(arguments), 'warn'); } catch(e) {}
          warn.apply(console, arguments); 
        };
        console.error = function() { 
          try { addLog(safeJoin(arguments), 'error'); } catch(e) {}
          error.apply(console, arguments); 
        };
      })();
    </script>
